[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
gas_limit = "18446744073709551615"
fs_permissions = [
  { access = "read", path = "../sim/data" },
  { access = "read-write", path = "../sim/out" },
]

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 110

[lint]
lint_on_build = false
